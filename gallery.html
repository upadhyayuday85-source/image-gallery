<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Image Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #1b1f2a;
      color: #f2f2f2;
      padding: 40px 20px;
    }

    h1 { text-align: center; font-size: 2rem; margin-bottom: 8px; }
    .sub { text-align: center; color: #9aa3b5; margin-bottom: 32px; }

    /* ---------- GRID ---------- */
    .gallery {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
      aspect-ratio: 4 / 3;
      background: #2a3040;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    /* ---------- HOVER ANIMATIONS ---------- */
    .item:hover img {
      transform: scale(1.12) rotate(1deg);
      filter: brightness(0.6);
    }

    .item .caption {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 12px;
      font-size: 0.95rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      transform: translateY(100%);
      transition: transform 0.35s ease;
    }
    .item:hover .caption { transform: translateY(0); }

    /* ---------- LIGHTBOX ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 100;
    }
    .lightbox.open { opacity: 1; visibility: visible; }

    .lightbox img {
      max-width: 88vw;
      max-height: 80vh;
      border-radius: 8px;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }
    .lightbox.open img { transform: scale(1); }

    .lb-caption {
      position: absolute;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      color: #ddd;
    }

    .lb-btn {
      position: absolute;
      background: none;
      border: none;
      color: #fff;
      font-size: 2.4rem;
      cursor: pointer;
      padding: 10px 16px;
      transition: transform 0.2s ease, color 0.2s ease;
    }
    .lb-btn:hover { transform: scale(1.2); color: #ffb454; }
    .lb-btn:focus-visible { outline: 2px solid #ffb454; }

    .lb-close { top: 12px; right: 16px; }
    .lb-prev  { left: 10px; top: 50%; transform: translateY(-50%); }
    .lb-next  { right: 10px; top: 50%; transform: translateY(-50%); }
    .lb-prev:hover, .lb-next:hover { transform: translateY(-50%) scale(1.2); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <h1>Interactive Image Gallery</h1>
  <p class="sub">Kisi bhi image par click karo</p>

  <div class="gallery" id="gallery">
    <!-- Images JS se yahan add hongi -->
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-btn lb-close" id="closeBtn" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" id="prevBtn" aria-label="Previous image">&#8249;</button>
    <img id="lbImg" src="" alt="">
    <button class="lb-btn lb-next" id="nextBtn" aria-label="Next image">&#8250;</button>
    <p class="lb-caption" id="lbCaption"></p>
  </div>

  <script>
    // 1) Images ka data — apni images ke path/URL yahan daal sakte ho
    //    (jaise "gallery-images/pic1.jpg")
    const images = [
      { src: "gallery-images/pic1.jpg", title: "Photo 1" },
      { src: "gallery-images/pic2.jpg", title: "Photo 2" },
      { src: "gallery-images/pic3.jpg", title: "Photo 3" },
      { src: "gallery-images/pic4.jpg", title: "Photo 4" },
      { src: "gallery-images/pic5.jpg", title: "Photo 5" },
      { src: "gallery-images/pic6.jpg", title: "Photo 6" },
      { src: "gallery-images/pic7.jpg", title: "Photo 7" },
      { src: "gallery-images/pic8.jpg", title: "Photo 8" }
    ];

    const gallery  = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lbImg    = document.getElementById("lbImg");
    const lbCaption = document.getElementById("lbCaption");
    let current = 0;

    // 2) Grid banao (DOM manipulation)
    images.forEach((img, index) => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <img src="${img.src}" alt="${img.title}" loading="lazy">
        <div class="caption">${img.title}</div>
      `;
      item.addEventListener("click", () => openLightbox(index)); // event handling
      gallery.appendChild(item);
    });

    // 3) Lightbox functions
    function showImage(index) {
      current = (index + images.length) % images.length; // loop around
      lbImg.src = images[current].src;
      lbImg.alt = images[current].title;
      lbCaption.textContent = `${images[current].title} (${current + 1}/${images.length})`;
    }

    function openLightbox(index) {
      showImage(index);
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeBtn").addEventListener("click", closeLightbox);
    document.getElementById("prevBtn").addEventListener("click", () => showImage(current - 1));
    document.getElementById("nextBtn").addEventListener("click", () => showImage(current + 1));

    // background par click = close
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // keyboard: Esc, left, right
    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showImage(current - 1);
      if (e.key === "ArrowRight") showImage(current + 1);
    });
  </script>
</body>
</html>
